name: Check site

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:deploy
      - run: npm run build
      - run: npm run test:site
      - name: Check GitHub Pages base path
        run: npm run build && npm run test:site
        env:
          DEPLOY_SITE_URL: https://lxiaonan.github.io
          DEPLOY_BASE_PATH: /personal-website
